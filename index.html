    <script>
      (function() {
        try {
          var mode = localStorage.getItem('byahedor_theme_mode');
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'light') {
            isDark = false;
          } else {
            var legacy = localStorage.getItem('byahedor_dark_mode');
            if (legacy !== null) {
              isDark = legacy === 'true';
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              isDark = true;
            }
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
