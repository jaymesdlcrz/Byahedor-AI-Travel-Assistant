<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Byahedor — Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Redirects back to the root of the repo with relative path
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding-top: 50px; background: #F5FAFC; color: #102A43;">
    <h2>Redirecting to Byahedor...</h2>
    <p>Please wait a moment while we take you back to your travel dashboard.</p>
  </body>
</html>
